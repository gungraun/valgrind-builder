# spell-checker: ignore androideabi taiki binutils riscv dtolnay pipefail armv gungraun destdir
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get the release version from the tag
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Create release if it does not exist
        run: |
          if ! gh release view $VERSION &>/dev/null; then
            gh release create $VERSION --draft --verify-tag --title $VERSION -F CHANGELOG.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ env.VERSION }}

  build:
    name: Build artifacts
    needs: ["release"]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
        valgrind:
          - "3.26.0"
          - "3.25.1"
          - "3.25.0"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare
        run: |
          build_output="build/root"
          archive_dir="build/archive"
          archive_name="valgrind-${{ needs.release.outputs.version }}-${{ matrix.os }}-${{ matrix.valgrind }}.tar.gz"
          archive_sum="${archive_name}.sha256"

          echo "BUILD_OUTPUT=${build_output}" >> $GITHUB_ENV
          echo "ARCHIVE_DIR=${archive_dir}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${archive_name}" >> $GITHUB_ENV
          echo "ARCHIVE_SUM=${archive_sum}" >> $GITHUB_ENV
      - name: Check if archive already exists
        run: |
          set -o pipefail

          if gh release view ${{ needs.release.outputs.version }} --json assets | jq -e --arg name "${{ env.ARCHIVE_NAME }}" '.assets[] | select(.name == $name)'; then
            echo "Check: archive '${{ env.ARCHIVE_NAME }}' already exists for this version '${{ needs.release.outputs.version }}'"
            echo "CHECK=failure" >> $GITHUB_ENV
          else
            echo "CHECK=success" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install prerequisites
        if: env.CHECK == 'success'
        run: ./prepare.sh
      - name: Build valgrind
        if: env.CHECK == 'success'
        run: ./build_valgrind.sh ${{ matrix.valgrind }}
      - name: Create archive
        if: env.CHECK == 'success'
        run: |
          build_output="${{ env.BUILD_OUTPUT }}"
          archive_dir="${{ env.ARCHIVE_DIR }}"
          archive_name="${{ env.ARCHIVE_NAME }}"
          archive_sum="${{ env.ARCHIVE_SUM }}"

          make -j"$(nproc)" install DESTDIR="${build_output}"

          mkdir -p "${archive_dir}"
          cd "${archive_dir}"
          tar czf "${archive_name}" -C "${build_output}" usr/
          sha256sum "$archive_name" > "$archive_sum"
      - name: Upload archive
        if: env.CHECK == 'success'
        run: gh release upload "${{ needs.release.outputs.version }}" "${{ env.ARCHIVE_NAME }}" "${{ env.ARCHIVE_SUM }}"
        working-directory: "${{ env.ARCHIVE_DIR }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
