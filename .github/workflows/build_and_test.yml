# spell-checker: ignore androideabi taiki binutils riscv dtolnay pipefail armv gungraun destdir
# spell-checker: ignore cachegrind memcheck ncpu
name: Build and test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ubuntu:
    name: Build artifacts
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
        valgrind:
          - "3.23.0"
          - "3.24.0"
          - "3.25.0"
          - "3.25.1"
          - "3.26.0"
          - "3.27.0"
          - "3.27.1"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install prerequisites
        run: ./prepare.sh
      - name: Build valgrind
        run: ./build_valgrind.sh ${{ matrix.valgrind }} linux
      - name: Install valgrind
        run: |
          cd build/valgrind-"${{ matrix.valgrind }}"
          sudo make -j"$(nproc)" install
      - name: Run and test valgrind
        run: |
          /usr/bin/valgrind --tool=cachegrind ls -la
          /usr/bin/valgrind --tool=memcheck ls -la

  build_freebsd:
    name: Build artifacts
    strategy:
      fail-fast: false
      matrix:
        freebsd:
          - "14.0"
          - "14.1"
          - "14.2"
          - "14.3"
          - "15.0"
        valgrind:
          - "3.23.0"
          - "3.24.0"
          - "3.25.0"
          - "3.25.1"
          - "3.26.0"
          - "3.27.0"
          - "3.27.1"
        exclude:
          - freebsd: "15.0"
            valgrind: "3.23.0"
          - freebsd: "15.0"
            valgrind: "3.24.0"
          - freebsd: "15.0"
            valgrind: "3.25.0"
          - freebsd: "15.0"
            valgrind: "3.25.1"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cross-platform-actions/action@v1.0.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: ${{ matrix.freebsd }}
          shell: bash
          memory: 8G
          cpu_count: 4
          sync_files: runner-to-vm
          run: |
            # Install prerequisites
            sudo pkg install -y wget autoconf automake gcc git bzip2 gmake

            ./build_valgrind.sh "${{ matrix.valgrind }}" "freebsd"

            # Install, run and test valgrind
            cd build/valgrind-"${{ matrix.valgrind }}"
            sudo gmake -j"$(sysctl -n hw.ncpu)" install
            /usr/local/bin/valgrind --tool=memcheck ls -la
